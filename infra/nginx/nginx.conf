# ============================================================
# Nginx — Reverse proxy for ShopNext
# HTTP only (terminate TLS at load balancer or add Let's Encrypt)
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # Performance
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # Security headers
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy "strict-origin-when-cross-origin";

  # Hide server version
  server_tokens off;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/m;

  # ----------------------------------------------------------
  # Upstream definitions
  # ----------------------------------------------------------
  upstream api_backend {
    server api:3000;
    keepalive 32;
  }

  upstream web_frontend {
    server web:3001;
    keepalive 32;
  }

  # ----------------------------------------------------------
  # Main server block
  # ----------------------------------------------------------
  server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Health check endpoint (no rate limit)
    location = /health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # ----------------------------------------------------------
    # API — /api/v1/*
    # ----------------------------------------------------------
    location /api/v1/auth/ {
      limit_req zone=api_auth burst=10 nodelay;
      limit_req_status 429;

      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_read_timeout 30s;
    }

    location /api/ {
      limit_req zone=api_general burst=30 nodelay;
      limit_req_status 429;

      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_read_timeout 30s;
    }

    # Swagger docs (allow unrestricted in dev; restrict in prod via IP or auth)
    location /api/docs {
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   Connection "";
    }

    # ----------------------------------------------------------
    # Next.js static assets (long cache)
    # ----------------------------------------------------------
    location /_next/static/ {
      proxy_pass         http://web_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      expires            365d;
      add_header         Cache-Control "public, immutable";
    }

    location /_next/ {
      proxy_pass         http://web_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   Connection "";
    }

    # ----------------------------------------------------------
    # Frontend — everything else
    # ----------------------------------------------------------
    location / {
      proxy_pass         http://web_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_read_timeout 30s;
    }
  }
}
